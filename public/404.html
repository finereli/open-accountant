<!doctype html>
<!-- Its presence turns off Cloudflare Pages' SPA fallback. Without it, a
     request for a removed build file (/assets/index-OLD.js) got index.html
     back with a 200 and a 4-hour cache, Chrome stored HTML under a script
     URL, and the app went blank until site data was cleared. Routing is
     hash-based (#/...), so nothing legitimate needs the fallback. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Not found</title>
    <meta name="robots" content="noindex" />
  </head>
  <body style="font-family: system-ui, sans-serif; text-align: center; padding: 48px 24px; color: #5c6f6d">
    <p>Not found. <a href="/" style="color: #0c4a4f">Open Accountant</a></p>
  </body>
</html>
